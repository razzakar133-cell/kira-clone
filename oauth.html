<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kira — Google sign-in code</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #eef2f7; color: #141a33; margin: 0; padding: 24px 16px; }
  .card { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { font-size: 15px; line-height: 1.6; margin: 8px 0; }
  .code { width: 100%; box-sizing: border-box; font-size: 17px; font-family: ui-monospace, monospace; word-break: break-all; padding: 14px; border: 2px solid #2f6bff; border-radius: 12px; background: #f5f7ff; margin: 12px 0; }
  button { display: block; width: 100%; padding: 14px; font-size: 17px; font-weight: 700; color: #fff; background: #2f6bff; border: 0; border-radius: 999px; cursor: pointer; }
  button:active { opacity: .85; }
  .done { color: #15803d; font-weight: 700; text-align: center; display: none; margin-top: 10px; }
  .err { color: #b91c1c; font-weight: 700; }
  .muted { color: #666; font-size: 13px; }
</style>
</head>
<body>
<div class="card">
  <h1>🔐 Kira — Google sign-in</h1>
  <div id="body"></div>
</div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var err = params.get('error');
  var body = document.getElementById('body');
  if (err) {
    body.innerHTML = '<p class="err">Google sign-in failed: ' + escapeHtml(err) + '</p>'
      + '<p>গুগল সাইন-ইন হয়নি। অ্যাপে ফিরে আবার চেষ্টা করো।<br>Google sign-in did not complete. Go back to the app and try again.</p>';
    return;
  }
  if (!code) {
    body.innerHTML = '<p class="err">এই লিংকে কোনো কোড নেই।</p>'
      + '<p>গুগল থেকে এখানে আসার কথা — অ্যাপে ফিরে Sign in with Google আবার চাপো।<br>No code in this link. Please start Google sign-in from the Kira app again.</p>';
    return;
  }
  body.innerHTML = '<p><b>এই কোডটি কপি করে Kira অ্যাপের Google Sign-in-এ বসাও</b><br>'
    + '<span class="muted">Copy this code and paste it into Kira&rsquo;s Google Sign-in screen.</span></p>'
    + '<input class="code" id="codeBox" readonly value="' + escapeHtml(code) + '">'
    + '<button id="copyBtn" type="button">📋 Copy code / কোড কপি করো</button>'
    + '<p class="done" id="done">✅ Copied! এখন অ্যাপে গিয়ে কোডটি বসাও।</p>'
    + '<p class="muted">কোডটি শুধু এই সাইন-ইনের জন্য — অন্য কাউকে দিও না।<br>This code works only for this sign-in — do not share it.</p>';
  var box = document.getElementById('codeBox');
  box.focus();
  box.select();
  document.getElementById('copyBtn').addEventListener('click', function () {
    box.select();
    var ok = false;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(showDone, function () { fallbackCopy(); });
    } else {
      fallbackCopy();
    }
    function fallbackCopy() {
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      if (ok) showDone();
    }
    function showDone() { document.getElementById('done').style.display = 'block'; }
  });
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
})();
</script>
</body>
</html>
